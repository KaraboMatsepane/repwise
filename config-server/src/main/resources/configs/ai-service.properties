server.port=8002

spring.mongodb.uri=${MONGODB_URI}
# Creates the indexes declared on documents at startup, such as the unique index on a recommendation's activityId.
spring.data.mongodb.auto-index-creation=true

gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
gemini.api.key=${GEMINI_API_KEY}
# How long to wait for Gemini's complete answer before failing the call (then retried / dead-lettered).
gemini.api.timeout=${GEMINI_API_TIMEOUT:30s}

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/repwise-oauth2
